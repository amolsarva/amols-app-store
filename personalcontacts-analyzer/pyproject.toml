[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-contacts-analyzer"
version = "0.1.0"
description = "Local Gmail IMAP header archive and analysis tooling."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pca = "personal_contacts_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
